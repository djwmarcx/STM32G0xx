# This is the configuration file for PlatformIO, a cross-platform tool and IDE
# to build and develop software for embedded systems.
#
# To build the firmware with PlatformIO, install PlatformIO Core (CLI, no GUI):
# - https://docs.platformio.org/en/latest//core/installation.html
#
# Typical command line usage:
#
#    # Build firmware for the BTT SKR Mini E3 V3.0
#    pio run -e BTT_SKR_MINI_E3_V30
#    # Flash via ST-Link (SWD), preserving the BTT SD-card bootloader:
#    pio run -e BTT_SKR_MINI_E3_V30 -t upload
#    # Or copy .pio/build/BTT_SKR_MINI_E3_V30/firmware.bin to a FAT32 SD card
#    # and power cycle the board to flash via the stock bootloader.
#

[platformio]
include_dir = Inc
src_dir = Src
# Personal/machine-specific build environments go in platformio_local.ini (not tracked by git)
extra_configs = platformio_local.ini

[common]
build_flags =
  -I .
  -I boards
  -D RX_BUFFER_SIZE=512
  -D NVS_SIZE=1536
  # Ignore all settings in Inc/my_machine.h (and instead use the below build flags)
  -D OVERRIDE_MY_MACHINE
build_src_filter =
  +<*>
  -<usb_serial.c>
  -<i2c.c>
  -<diskio.c>
lib_deps =
  boards
  grbl
  keypad
  motors
  odometer
  plugins
lib_extra_dirs =
  .

[env]
platform = ststm32
framework = stm32cube
# Do not produce .a files for lib deps (which would prevent them from overriding weak symbols)
lib_archive = no
lib_ldf_mode = off

[env:BTT_SKR_MINI_E3_V30]
board = nucleo_g0b1re
board_build.ldscript = STM32G0B1RETX_FLASH.ld
build_flags = ${common.build_flags}
  # See Inc/my_machine.h for options
  -D BOARD_BTT_SKR_MINI_E3_V30=
  -D USB_SERIAL_CDC=0
  # Relocate the vector table where the BTT boot loader expects to find it
  -D HAS_BOOTLOADER=
  -D USER_VECT_TAB_ADDRESS
  -D VECT_TAB_OFFSET=0x00002000U
build_src_filter = ${common.build_src_filter}
lib_deps = ${common.lib_deps}
  trinamic
lib_extra_dirs = ${common.lib_extra_dirs}
# Upload flashes the ELF at its linked address (0x08002000), the BTT bootloader is preserved.
upload_protocol = stlink

[env:BTT_SKR_MINI_E3_V30_USB]
board = nucleo_g0b1re
board_build.ldscript = STM32G0B1RETX_FLASH.ld
build_flags = ${common.build_flags}
  -I Middlewares/ST/STM32_USB_Device_Library/Class/CDC/Inc
  -I Middlewares/ST/STM32_USB_Device_Library/Core/Inc
  -I USB_DEVICE/Target
  # See Inc/my_machine.h for options
  -D BOARD_BTT_SKR_MINI_E3_V30=
  -D USB_SERIAL_CDC=1
  # Relocate the vector table where the BTT boot loader expects to find it
  -D HAS_BOOTLOADER=
  -D USER_VECT_TAB_ADDRESS
  -D VECT_TAB_OFFSET=0x00002000U
build_src_filter =
  +<*>
  -<i2c.c>
  -<diskio.c>
lib_deps = ${common.lib_deps}
  trinamic
  Core
  Class
  App
  Target
lib_extra_dirs = ${common.lib_extra_dirs}
  Middlewares/ST/STM32_USB_Device_Library
  USB_DEVICE
upload_protocol = stlink
